name: Daily TABELA Run

on:
  schedule:
    # 7:00 AM EST is 12:00 PM UTC (or 11:00 AM EDT depending on Daylight Saving Time)
    # The cron schedule below uses UTC. Adjust if you meant 7:00 AM UTC.
    - cron: '0 11 * * 1-5' # Runs at 11:00 AM UTC, Monday-Friday
  workflow_dispatch: # Allows triggering manually from the GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Use the version matching your setup
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run TABELA Pipeline
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # Running the main entry point directly to avoid the 'pause' in main.bat
          python runners/main.py

      - name: Upload Logs/Output as Artifact (Optional)
        uses: actions/upload-artifact@v4
        with:
          name: tabela-outputs
          path: |
            # Include paths where your reports or logs are saved, example:
            # logs/
            # data/reports/
            *
          retention-days: 7
