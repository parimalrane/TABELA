name: Daily TABELA Run

on:
  schedule:
    # 6:30 AM Eastern Time is roughly 10:30 AM UTC (11:30 AM EST in Winter).
    # You can adapt the exact UTC hour here. 
    - cron: '30 10 * * 1-5' # Runs at 10:30 AM UTC, Monday-Friday
  workflow_dispatch: # Allows triggering manually from the GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to push code back to the repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Use the version matching your setup
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Market Data & TABELA Pipeline
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # 1. First, generate the market file 
          python runners/update_market_metrics.py
          
          # 2. Then, run the main pipeline immediately after
          python runners/main.py

      - name: Commit and push generated files
        run: |
          # Configure git to run as the GitHub Actions bot
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Stage all new and modified files
          git add .
          
          # Check if there are any changes to commit, and push them if there are
          git diff --quiet && git diff --staged --quiet || (git commit -m "actions: automated TABELA pipeline outputs" && git push)
