name: Daily TABELA Run

on:
  schedule:
    # 6:00 AM Eastern Time (EDT) is 10:00 AM UTC. In winter (EST), 6:00 AM is 11:00 AM UTC.
    # Adjust to '0 11 * * 1-5' when daylight savings ends if strict 6 AM is desired.
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Use the version matching your setup
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Market Data & TABELA Pipeline
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # 1. Update Market Context to generate the market_data CSV
          python runners/update_market_metrics.py
          
          # 2. Run the main pipeline and pipe the terminal output to a file
          python runners/main.py > terminal_output.txt
          
          # 3. Print it to the console so GitHub Actions logs still show the output
          cat terminal_output.txt

      - name: Extract Market Date
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          export MARKET_DATE=$(python -c "from config.runtime_context import context; print(context.market_date)")
          echo "MARKET_DATE=$MARKET_DATE" >> $GITHUB_ENV

      - name: Send Terminal Output to Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: TABELA Daily Scan - ${{ env.MARKET_DATE }}
          to: parimalrane@gmail.com
          from: TABELA Auto-Pipeline
          body: file://terminal_output.txt
          ignore_cert: true
        continue-on-error: true

      - name: Commit and push generated files
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Stage all new and modified files
          git add .
          
          # Check if there are any changes to commit, and push them if there are
          git diff --quiet && git diff --staged --quiet || (git commit -m "TABELA Scan: $MARKET_DATE" && git push)
